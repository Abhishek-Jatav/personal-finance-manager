spring.application.name=personal-finance-manager
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.http-only=true

management.endpoints.web.exposure.include=health

# Business settings
app.timezone=Asia/Kolkata
app.currency=INR
# The assignment asks for session cookies only, so CSRF protection is OFF by default.
# Set to true to turn it on (clients must then send the X-XSRF-TOKEN header).
app.security.csrf-enabled=false
